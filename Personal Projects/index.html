<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="business-card">
        <div class="left-section">
            <img src="images/TaborHeadshot Final - Copy.png" alt="Profile Image" class="profile-image">
            <h1> Tabor Cote</h1>
            <h2> Photographer | Graphic Designer</h2>
        </div>
        <div class="right-section">
            <div class="contact-info">
                <p><img src="images/phone-receiver-silhouette.png" alt="Phone Icon"> 509.209.0466</p>
                <p><a href="https://www.taborcote.com/"><img src="images/world-wide-web.png" alt="Website Icon"> Portfolio</p></a>
                <p><img src="location-icon.png" alt="Location Icon"> Portland OR</p>
            </div>
            <div class="social-icons">
                <a href="https://www.instagram.com/tabor_cote/"><img src="images/instagram.png" alt="Instagram"></a>
                <a href="https://www.tiktok.com/@taborcote?is_from_webapp=1&sender_device=pc"><img src="images/tik-tok.png" alt="TikTok"></a>
                <a href="www.linkedin.com/in/tabor-cote"><img src="images/linkedin.png" alt="LinkedIn"></a>
            </div>
        </div>
    </div>
</body>
</html>
